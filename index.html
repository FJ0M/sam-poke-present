<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1e1b4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>POCKET SAM</title>
<meta property="og:title" content="POCKET SAM: Mr Chicken's Birthday Quest">
<meta property="og:description" content="A birthday game made just for Sam. Catch your cats, battle your mates, beat the accountant.">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png"><text y='.9em' font-size='90'>🐔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<meta property="og:image" content="https://fj0m.github.io/sam-poke-present/logo.png">
</head>
<body>
<div id="console">
  <div id="bezel"><main id="app"></main></div>
  <div id="pad" aria-label="Game controls">
    <div class="dpad">
      <button class="dp up" data-k="up" aria-label="Up"></button>
      <button class="dp left" data-k="left" aria-label="Left"></button>
      <span class="dp mid"></span>
      <button class="dp right" data-k="right" aria-label="Right"></button>
      <button class="dp down" data-k="down" aria-label="Down"></button>
    </div>
    <div class="ab">
      <div><button class="round b" data-k="b">B</button></div>
      <div><button class="round a" data-k="a">A</button></div>
    </div>
    <div class="ss">
      <div><button class="pill" data-k="select"></button><span>SELECT</span></div>
      <div><button class="pill" data-k="start"></button><span>START</span></div>
    </div>
  </div>
</div>
<script src="content.js"></script>
<script src="pixels.js"></script>
<script src="maps.js"></script>
<script src="game.js"></script>
<script src="minigames.js"></script>
<script src="world.js"></script>
</body>
</html>
